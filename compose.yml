x-airflow-common: &airflow-common
  build:
    context: ./infra/airflow
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    - AIRFLOW_HOME=/opt/airflow
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/airflow_db
    - AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE=10
    - AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW=20
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__PARALLELISM=4
    - AIRFLOW__CORE__INTERNAL_API_URL=http://airflow-webserver:8080
    - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
    - AIRFLOW__API_AUTH__JWT_SECRET=ml-platform-airflow-jwt-secret-key-for-local-dev-must-be-at-least-64-bytes-long
    - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS=admin:admin
    - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS=True
  volumes:
    - ./infra/airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./infra/airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
  networks:
    - ml-platform-network

services:
  api:
    build:
      context: .
      target: dev
    container_name: ml-platform-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    networks:
      - ml-platform-network

  airflow-postgres:
    image: postgres:16-alpine
    container_name: ml-airflow-postgres
    attach: false
    profiles:
      - airflow
    environment:
      - POSTGRES_DB=airflow_db
      - POSTGRES_USER=${AIRFLOW_POSTGRES_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d airflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - ml-platform-network

  airflow-init:
    <<: *airflow-common
    container_name: ml-airflow-init
    profiles:
      - airflow
    command: ["/entrypoint.sh", "init"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: ml-airflow-webserver
    profiles:
      - airflow
    command: ["/entrypoint.sh", "api-server"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: ml-airflow-scheduler
    profiles:
      - airflow
    command: ["/entrypoint.sh", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: ml-airflow-dag-processor
    profiles:
      - airflow
    command: [ "/entrypoint.sh", "dag-processor" ]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow_postgres_data:
  airflow_logs:

networks:
  ml-platform-network:
    driver: bridge
