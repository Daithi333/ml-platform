name: newsgroups-classifier
experiment: newsgroups-classifier
architecture: text_classifier

dataset:
  source: sklearn_builtin
  name: 20newsgroups
  categories:
    - sci.space
    - sci.med
    - rec.sport.baseball
    - comp.graphics
    - talk.politics.misc
  test_size: 0.2
  random_state: 42

params:
  max_features: 10000
  ngram_range: [1, 2]
  max_iter: 1000
  C: 1.0

labels:
  - sci.space
  - sci.med
  - rec.sport.baseball
  - comp.graphics
  - talk.politics.misc
